# yaml-language-server: $schema=https://docs.mergify.com/mergify-configuration-schema.json
merge_queue:
  mode: serial
  # One batch at a time: a batch takes 11 jobs, and two of them plus PR CI overran the 20 runners the plan allows.
  max_parallel_checks: 1

queue_rules:
  - name: main
    # Queue with @mergifyio queue, or label the PR `ready` (pull_request_rules below); passing CI alone is not merge
    # consent.
    queue_conditions:
      - base = main
      - -draft
      # A test or CI fix enters the queue straight away: the batch runs every check on it anyway.
      - or:
          - check-success = Run tests
          - label = ci-fix
          - label = flaky-test
    merge_conditions:
      - check-success = Run tests
      # Distinct merge conditions force batch validation after the lighter PR checks.
      - check-success = Tests (app-browser-1)
      - check-success = Tests (app-browser-2)
      - check-success = Tests (app-browser-3)
      - check-success = Behaviour specs (1/4)
      - check-success = Behaviour specs (2/4)
      - check-success = Behaviour specs (3/4)
      - check-success = Behaviour specs (4/4)
    # Required reviews/checks from GitHub must hold to merge, not to queue, so a fix can queue before its own CI ends.
    branch_protection_injection_mode: merge
    merge_method: squash
    # Two while batches fail often (42% from Nov 9 to 12): a failed batch of two needs at most one split to find the
    # PR at fault. Go back to three once fewer than about 1 in 10 batches fail.
    batch_size: 2
    batch_max_wait_time: 30 seconds
    # Failed batches are bisected; do not hide failures with automatic CI retries.
    max_checks_retries: 0

# Fixes for failing tests and CI jump the queue: a red test ejects every batch it lands in, so it is fixed first.
priority_rules:
  # Batches running without a flaky-test fix are likely to fail on the same test, so stop them and test the fix first.
  - name: fix-flaky-test
    conditions:
      - label = flaky-test
    priority: high
    allow_checks_interruption: true
  # Other CI fixes go next, without discarding the batch already running: interrupting for every one of them threw
  # away three batches in twenty minutes.
  - name: unblock-queue
    conditions:
      - or:
          - label = ci-fix
          - title ~= ^fix\((ci|test)\)
    priority: high
    allow_checks_interruption: false

# The `ready` label is merge consent that doesn't need the author around: the PR queues once its queue conditions
# hold (Run tests green, approved, no conflict), even if the session that opened it has stopped.
pull_request_rules:
  - name: queue PRs labelled ready
    conditions:
      - base = main
      - label = ready
    actions:
      queue:
