name: Production setup smoke

on:
  # After Cloudflare Workers Builds reports a successful build of the camnc Worker (production) on main.
  check_run:
    types: [completed]
  schedule:
    - cron: '0 6 * * *'
  # Not on pull requests: they would run the branch's smoke script against production, which fails
  # whenever the script expects UI that has not been deployed yet.
  workflow_dispatch:
    inputs:
      base_url:
        description: camNC deployment URL
        type: string
        required: true
        default: https://run.camnc.app/

permissions:
  contents: read

jobs:
  setup-smoke:
    # The queue SHA becomes main unchanged, so its check suite may still name the queue branch.
    # Only the production app Worker emits this exact check; previews use camnc-preview.
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.conclusion == 'success' &&
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: camnc')
    # Job level (not workflow level), so that skipped runs don't cancel a running smoke run.
    concurrency:
      group: setup-smoke-${{ (github.event_name == 'check_run' || github.event_name == 'schedule') && 'production' || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    container:
      # Keep this version in sync with the lockfile; CI's test:ci checks it.
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed setup
        run: pnpm --filter @wbcnc/camNC smoke:setup
        env:
          CAMNC_SMOKE_URL: ${{ inputs.base_url || 'https://run.camnc.app/' }}
      - name: Upload smoke report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: setup-smoke
          path: output/playwright/setup-smoke/
          if-no-files-found: warn
          retention-days: 7
