name: Production setup smoke

# Not on check_run: Cloudflare Workers Builds no longer builds production (Deploy replaced it), and every check run of
# any app started this workflow only for it to skip, thousands of runs a week.
on:
  schedule:
    - cron: '0 6 * * *'
  # After the Deploy workflow deploys production from GitHub Actions.
  workflow_call:
  # Not on pull requests: they would run the branch's smoke script against production, which fails
  # whenever the script expects UI that has not been deployed yet.
  workflow_dispatch:
    inputs:
      base_url:
        description: camNC deployment URL
        type: string
        required: true
        default: https://run.camnc.app/

permissions:
  contents: read

jobs:
  setup-smoke:
    # Scheduled smokes and those Deploy calls after a production deploy share one group, so they never overlap.
    concurrency:
      group: setup-smoke-${{ (github.event_name == 'schedule' || github.ref == 'refs/heads/main') && 'production' || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    container:
      # Keep this version in sync with the lockfile; CI's test:ci checks it.
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed setup
        run: pnpm --filter @wbcnc/camNC smoke:setup
        env:
          CAMNC_SMOKE_URL: ${{ inputs.base_url || 'https://run.camnc.app/' }}
      - name: Upload smoke report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: setup-smoke
          path: output/playwright/setup-smoke/
          if-no-files-found: warn
          retention-days: 7
