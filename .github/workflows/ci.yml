name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  # A new PR commit supersedes its previous checks; main pushes can still run independently.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint and types
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check CI configuration
        run: pnpm run test:ci
      # Turborepo's local cache, so packages whose inputs did not change replay their result.
      # Fork PRs keep local snapshots; only trusted repository jobs may exchange an identity token.
      - name: Authenticate remote cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
          audience: https://vercel.com/camnc-ci-cache
          policy: ${{ vars.TURBO_POLICY_ID }}
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-checks-${{ github.sha }}
          restore-keys: turbo-checks-
      - name: Check formatting
        run: pnpm run check-format
      - name: Run linting
        run: pnpm run lint
      - name: Check types
        run: pnpm run check-types
      # This job already persists the default build cache. Keep builds off the browser test path.
      - name: Build
        run: pnpm run build

  test:
    name: Tests (${{ matrix.suite }})
    permissions:
      contents: read
      id-token: write
    # CAD/WASM, the app browser suite, and OpenCV must not compete for one runner's CPUs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cam
            tasks: test
            args: run
            filter: --filter=@wbcnc/cam
            performance: pnpm --filter @wbcnc/cam test:performance
          - suite: app-core
            tasks: test:domain test:worker test:licenses
            args: ''
            filter: --filter=@wbcnc/camNC
            performance: pnpm --filter @wbcnc/camNC test:performance
          - suite: app-browser-1
            tasks: test:browser
            args: --shard=1/2
            filter: --filter=@wbcnc/camNC
            performance: ''
          - suite: app-browser-2
            tasks: test:browser
            args: --shard=2/2
            filter: --filter=@wbcnc/camNC
            performance: ''
          - suite: packages
            tasks: test
            args: run
            filter: --filter=!@wbcnc/cam --filter=!@wbcnc/camNC --concurrency=1
            performance: ''
    runs-on: ubuntu-24.04
    container:
      # Keep this version in sync with the lockfile; test:ci checks both browser workflows.
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Turborepo's local cache, so packages whose inputs did not change replay their result.
      # Git refuses this container's checkout, so scripts/turbo-shared-cache.mjs can't find the git dir. Name the
      # directory here, or the cache action saves a path turbo never wrote.
      # Fork PRs keep local snapshots; only trusted repository jobs may exchange an identity token.
      - name: Authenticate remote cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
          audience: https://vercel.com/camnc-ci-cache
          policy: ${{ vars.TURBO_POLICY_ID }}
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-test-${{ matrix.suite }}-${{ github.sha }}
          restore-keys: turbo-test-${{ matrix.suite }}-
      # A module that never finishes importing hits no test timeout, so bound the step. Turbo groups logs in CI, which
      # would leave a hung run with no output; stream them to show which files finished.
      - name: Run tests
        timeout-minutes: 20
        env:
          TURBO_CACHE_DIR: .turbo/cache
        run: node scripts/turbo-shared-cache.mjs run ${{ matrix.tasks }} --log-order=stream ${{ matrix.filter }} -- ${{ matrix.args }}
      # Each gate gets an otherwise idle runner, just as in the root test script.
      - name: Performance gates
        if: matrix.performance != ''
        run: ${{ matrix.performance }}
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            apps/camNC/test-results
            packages/*/test-results

  specs:
    name: Behaviour specs (${{ matrix.shard }})
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    container:
      # Keep this version in sync with the lockfile; test:ci checks both browser workflows.
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fork PRs keep local snapshots; only trusted repository jobs may exchange an identity token.
      - name: Authenticate remote cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
          audience: https://vercel.com/camnc-ci-cache
          policy: ${{ vars.TURBO_POLICY_ID }}
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-specs-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: turbo-specs-${{ strategy.job-index }}-
      - name: Run sketch behaviour specs
        timeout-minutes: 15
        env:
          TURBO_CACHE_DIR: .turbo/cache
        run: node scripts/turbo-shared-cache.mjs run spec:cad --filter=@wbcnc/camNC --log-order=stream -- --shard=${{ matrix.shard }}
      - name: Check the interactive spec session
        if: matrix.shard == '1/4'
        timeout-minutes: 5
        run: printf 'rect 10,10 100,60\nexpect {"entityCount":4}\nframe smoke\n' | pnpm --silent --filter @wbcnc/camNC spec:session
      - name: Upload spec results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behaviour-specs-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: apps/camNC/test-results/spec

  results:
    # Keep the check required by main's ruleset, including builds now running in checks.
    name: Run tests
    if: always()
    needs: [checks, test, specs, fluidnc-sim]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation jobs to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SPECS_RESULT: ${{ needs.specs.result }}
          SIM_RESULT: ${{ needs.fluidnc-sim.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TEST_RESULT" = success
          test "$SPECS_RESULT" = success
          test "$SIM_RESULT" = success

  fluidnc-sim:
    name: FluidNC simulator integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Get simulator toolchain
        id: simulator-toolchain
        run: |
          set -o pipefail
          {
            cat /etc/os-release
            g++ --version
            ldd --version
            pio --version
            python --version
          } | sha256sum | awk '{print "hash=" $1}' >> "$GITHUB_OUTPUT"
      - name: Cache FluidNC simulator build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/camnc
            ~/.platformio
          # sim.mjs pins FluidNC and controls its build; the patch and toolchain must match the binary.
          key: fluidnc-sim-${{ runner.os }}-${{ runner.arch }}-${{ steps.simulator-toolchain.outputs.hash }}-${{ hashFiles('packages/fluidnc/scripts/sim.mjs', 'packages/fluidnc/sim/sim-speed.patch') }}
      - name: Start simulator with the 3.9.9 personality proxy
        working-directory: packages/fluidnc
        run: |
          started=$SECONDS
          node scripts/sim.mjs --v3 > sim.log 2>&1 &
          for i in $(seq 1 600); do
            if (echo > /dev/tcp/127.0.0.1/8848) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/8851) 2>/dev/null; then
              echo "Simulator ready after $((SECONDS - started)) s"
              # Show whether a cache hit reused the binary or rebuilt it, even on successful runs.
              cat sim.log
              exit 0
            fi
            sleep 1
          done
          echo "::error::The simulator did not open ports 8848 and 8851 within 600 s"
          tail -n 50 sim.log
          ps -ef | grep -E 'fluidnc|sim.mjs' | grep -v grep || true
          exit 1
      - name: Integration tests (FluidNC 4.1.1)
        working-directory: packages/fluidnc
        run: pnpm vitest run src/sim.integration.test.ts
        env:
          FLUIDNC_SIM_HOST: 127.0.0.1:8848
          FLUIDNC_SIM_VARIANT: v4
      - name: Integration tests (3.9.9 personality)
        working-directory: packages/fluidnc
        run: pnpm vitest run src/sim.integration.test.ts
        env:
          FLUIDNC_SIM_HOST: 127.0.0.1:8850
          FLUIDNC_SIM_VARIANT: v3-81
      - name: Simulator log
        if: failure()
        run: cat packages/fluidnc/sim.log
