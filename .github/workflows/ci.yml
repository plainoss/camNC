name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  # Mergify's merge queue tests cumulative batches through temporary draft PRs targeting main.
  pull_request:
    branches:
      - main
  # Mergify's flaky-test detection learns from runs on main, which pushes skip. Run every suite on main twice a weekday.
  schedule:
    - cron: '17 5,17 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  # A new PR commit supersedes its previous checks; main pushes can still run independently.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint and types
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      HAS_MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      # The only job that saves the pnpm store, and only on main: PR and merge-queue jobs read main's entry.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          save-cache: ${{ github.event_name == 'push' }}
      # node --test does not create the directory of its report.
      - name: Create the JUnit report directory
        run: mkdir -p test-results/junit
      # Also writes a JUnit report for Mergify, keeping the TAP output node --test prints when not on a terminal.
      - name: Check CI configuration
        id: ci-tests
        env:
          NODE_OPTIONS: --test-reporter=tap --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/junit/node-test.xml
        run: pnpm run test:ci
      # Node's junit reporter leaves top-level tests outside any <testsuite>, which Mergify's parser rejects.
      - name: Group node --test results into a suite
        if: (success() || failure()) && env.HAS_MERGIFY_TOKEN == 'true' && hashFiles('test-results/junit/node-test.xml') != ''
        run: node scripts/node-test-junit.mjs test-results/junit/node-test.xml
      - name: Upload CI configuration test results to Mergify
        if: (success() || failure()) && env.HAS_MERGIFY_TOKEN == 'true' && hashFiles('test-results/junit/node-test.xml') != ''
        uses: mergifyio/gha-mergify-ci@9a7adba0627bb4ff8f170b0e9854171b5b3e6235 # v29
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: test-results/junit/node-test.xml
          job_name: Format, lint and types (CI configuration)
          test_step_outcome: ${{ steps.ci-tests.outcome }}
      # Turborepo's local cache, so packages whose inputs did not change replay their result.
      # Fork PRs keep local snapshots; only trusted repository jobs may exchange an identity token.
      - name: Authenticate remote cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
          audience: https://vercel.com/camnc-ci-cache
          policy: ${{ vars.TURBO_POLICY_ID }}
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-checks-${{ github.sha }}
          restore-keys: turbo-checks-
      - name: Check formatting
        run: pnpm run check-format
      - name: Check file sizes
        run: pnpm run check-file-size
      - name: Check status scorecard
        run: pnpm run check-status
      - name: Run linting
        run: pnpm run lint
      - name: Check types
        run: pnpm run check-types
      # This job already persists the default build cache. Keep builds off the browser test path.
      - name: Build
        run: pnpm run build

  test:
    name: Tests (${{ matrix.suite }})
    # The queue validated the combined changes. Squash merges have new SHAs; Turbo caches by task inputs.
    # On main, checks keeps build caches warm.
    if: github.event_name != 'push'
    permissions: &turbo-permissions
      contents: read
      id-token: write
    # CAD/WASM, the app browser suite, and OpenCV must not compete for one runner's CPUs. Each browser shard gets its
    # own runner; the headless suites take seconds each, so they share one runner (and one setup) and run one task at a
    # time. They need no `vitest run`: Vitest never watches in CI.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: headless
            tasks: test @wbcnc/camNC#test:domain @wbcnc/camNC#test:worker @wbcnc/camNC#test:licenses
            args: ''
            filter: --filter=!@wbcnc/camNC --concurrency=1
            performance: pnpm run test:performance
    runs-on: ubuntu-24.04
    container: &browser-container
      # Keep this version in sync with the lockfile; test:ci checks both browser workflows.
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    defaults: &bash
      run:
        shell: bash
    env: &mergify-env
      HAS_MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN != '' }}
    steps: &test-steps
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      # Turborepo's local cache, so packages whose inputs did not change replay their result.
      # Git refuses this container's checkout, so scripts/turbo-shared-cache.mjs can't find the git dir. Name the
      # directory here, or the cache action saves a path turbo never wrote.
      # Fork PRs keep local snapshots; only trusted repository jobs may exchange an identity token.
      - name: Authenticate remote cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
          audience: https://vercel.com/camnc-ci-cache
          policy: ${{ vars.TURBO_POLICY_ID }}
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-test-${{ matrix.suite }}-${{ github.sha }}
          restore-keys: turbo-test-${{ matrix.suite }}-
      # node --test does not create the directory of its report.
      - name: Create the JUnit report directory
        if: matrix.suite == 'headless'
        run: mkdir -p apps/camNC/test-results/junit
      # A module that never finishes importing hits no test timeout, so bound the step. Turbo groups logs in CI, which
      # would leave a hung run with no output; stream them to show which files finished.
      # The Vitest suites report to Mergify themselves; both browser shards report as one suite. In the headless suites,
      # the Cloudflare Workers suites write JUnit reports instead, and so does node --test (camNC's license check),
      # keeping its TAP output. Both are uploaded below.
      - name: Run tests
        id: tests
        timeout-minutes: 20
        env:
          TURBO_CACHE_DIR: .turbo/cache
          # A replayed cache result runs no tests and reports nothing to Mergify, so scheduled runs execute everything.
          TURBO_FORCE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          MERGIFY_TEST_JOB_NAME: Tests (${{ startsWith(matrix.suite, 'app-browser-') && 'app-browser' || matrix.suite }})
          NODE_OPTIONS: ${{ matrix.suite == 'headless' && '--test-reporter=tap --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/junit/node-test.xml' || '' }}
        run: node scripts/turbo-shared-cache.mjs run ${{ matrix.tasks }} --log-order=stream ${{ matrix.filter }} -- ${{ matrix.args }}
      - name: Upload Cloudflare Workers test results to Mergify
        if: (success() || failure()) && env.HAS_MERGIFY_TOKEN == 'true' && hashFiles('apps/*/test-results/junit/worker.xml') != ''
        uses: mergifyio/gha-mergify-ci@9a7adba0627bb4ff8f170b0e9854171b5b3e6235 # v29
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: apps/*/test-results/junit/worker.xml
          job_name: Tests (${{ matrix.suite }}, Workers pool)
          test_step_outcome: ${{ steps.tests.outcome }}
      # Node's junit reporter leaves top-level tests outside any <testsuite>, which Mergify's parser rejects.
      - name: Group node --test results into a suite
        if: (success() || failure()) && env.HAS_MERGIFY_TOKEN == 'true' && hashFiles('apps/camNC/test-results/junit/node-test.xml') != ''
        run: node scripts/node-test-junit.mjs apps/camNC/test-results/junit/node-test.xml
      - name: Upload node --test results to Mergify
        if: (success() || failure()) && env.HAS_MERGIFY_TOKEN == 'true' && hashFiles('apps/camNC/test-results/junit/node-test.xml') != ''
        uses: mergifyio/gha-mergify-ci@9a7adba0627bb4ff8f170b0e9854171b5b3e6235 # v29
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: apps/camNC/test-results/junit/node-test.xml
          job_name: Tests (${{ matrix.suite }}, node --test)
          test_step_outcome: ${{ steps.tests.outcome }}
      # Like the root test script: both gates run one after the other on a runner whose functional tests have finished,
      # directly rather than through turbo, so a cached result never stands in for a measurement.
      - name: Performance gates
        if: matrix.performance != ''
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          MERGIFY_TEST_JOB_NAME: Tests (${{ matrix.suite }}, performance gates)
        run: ${{ matrix.performance }}
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            apps/camNC/test-results
            packages/*/test-results

  browser:
    name: Tests (${{ matrix.suite }})
    # Mergify's batch draft PRs run the browser shards once per batch. Ordinary PRs run the headless suites unless
    # labelled `full-ci`. Same container and steps as test.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'mergify/merge-queue/') || contains(github.event.pull_request.labels.*.name, 'full-ci')))
    permissions: *turbo-permissions
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: app-browser-1
            tasks: test:browser
            args: --shard=1/2
            filter: --filter=@wbcnc/camNC
            performance: ''
          - suite: app-browser-2
            tasks: test:browser
            args: --shard=2/2
            filter: --filter=@wbcnc/camNC
            performance: ''
    runs-on: ubuntu-24.04
    container: *browser-container
    defaults: *bash
    env: *mergify-env
    steps: *test-steps

  specs:
    name: Behaviour specs (${{ matrix.shard }})
    # Like browser, on Mergify batch PRs or PRs labelled `full-ci`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'mergify/merge-queue/') || contains(github.event.pull_request.labels.*.name, 'full-ci')))
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    container:
      # Keep this version in sync with the lockfile; test:ci checks both browser workflows.
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      HAS_MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      # Fork PRs keep local snapshots; only trusted repository jobs may exchange an identity token.
      - name: Authenticate remote cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
          audience: https://vercel.com/camnc-ci-cache
          policy: ${{ vars.TURBO_POLICY_ID }}
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-specs-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: turbo-specs-${{ strategy.job-index }}-
      # Writes a JUnit report for Mergify unless turbo replays the shard.
      - name: Run sketch behaviour specs
        id: specs
        timeout-minutes: 15
        env:
          TURBO_CACHE_DIR: .turbo/cache
          # A replayed cache result runs no tests and reports nothing to Mergify, so scheduled runs execute everything.
          TURBO_FORCE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/turbo-shared-cache.mjs run spec:cad --filter=@wbcnc/camNC --log-order=stream -- --shard=${{ matrix.shard }}
      - name: Upload behaviour spec results to Mergify
        if: (success() || failure()) && env.HAS_MERGIFY_TOKEN == 'true' && hashFiles('apps/camNC/test-results/junit/spec-*.xml') != ''
        uses: mergifyio/gha-mergify-ci@9a7adba0627bb4ff8f170b0e9854171b5b3e6235 # v29
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: apps/camNC/test-results/junit/spec-*.xml
          # One name for the four shards of the suite.
          job_name: Behaviour specs
          test_step_outcome: ${{ steps.specs.outcome }}
      - name: Check the interactive spec session
        if: matrix.shard == '1/4'
        timeout-minutes: 5
        run: printf 'rect 10,10 100,60\nexpect {"entityCount":4}\nframe smoke\n' | pnpm --silent --filter @wbcnc/camNC spec:session
      # node --test does not create the directory of its report.
      - name: Create the JUnit report directory
        if: matrix.shard == '1/4'
        run: mkdir -p apps/camNC/test-results/junit
      # Also writes a JUnit report for Mergify, keeping the TAP output node --test prints when not on a terminal.
      - name: Check rendering a saved design
        id: render
        if: matrix.shard == '1/4'
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --test-reporter=tap --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/junit/node-test.xml
        run: pnpm --filter @wbcnc/camNC test:render
      # Node's junit reporter leaves top-level tests outside any <testsuite>, which Mergify's parser rejects.
      - name: Group node --test results into a suite
        if: (success() || failure()) && matrix.shard == '1/4' && env.HAS_MERGIFY_TOKEN == 'true' && hashFiles('apps/camNC/test-results/junit/node-test.xml') != ''
        run: node scripts/node-test-junit.mjs apps/camNC/test-results/junit/node-test.xml
      - name: Upload rendering test results to Mergify
        if: (success() || failure()) && matrix.shard == '1/4' && env.HAS_MERGIFY_TOKEN == 'true' && hashFiles('apps/camNC/test-results/junit/node-test.xml') != ''
        uses: mergifyio/gha-mergify-ci@9a7adba0627bb4ff8f170b0e9854171b5b3e6235 # v29
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: apps/camNC/test-results/junit/node-test.xml
          job_name: Behaviour specs (rendering)
          test_step_outcome: ${{ steps.render.outcome }}
      - name: Upload spec results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behaviour-specs-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: apps/camNC/test-results/spec

  results:
    # Keep the check required by main's ruleset, including builds now running in checks.
    name: Run tests
    if: always() && github.event_name != 'push'
    needs: [checks, test, browser, specs, fluidnc-sim]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation jobs to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SPECS_RESULT: ${{ needs.specs.result }}
          SIM_RESULT: ${{ needs.fluidnc-sim.result }}
          # Only ordinary PRs without `full-ci` may skip browser suites; Mergify batches require them.
          QUEUE_ONLY_OPTIONAL: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TEST_RESULT" = success
          for result in "$BROWSER_RESULT" "$SPECS_RESULT"; do
            if [ "$QUEUE_ONLY_OPTIONAL" != true ] || [ "$result" != skipped ]; then test "$result" = success; fi
          done
          test "$SIM_RESULT" = success

  fluidnc-sim:
    name: FluidNC simulator integration
    # Like test, only on pull requests and in the merge queue.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Get simulator toolchain
        id: simulator-toolchain
        run: |
          set -o pipefail
          {
            cat /etc/os-release
            g++ --version
            ldd --version
            pio --version
            python --version
          } | sha256sum | awk '{print "hash=" $1}' >> "$GITHUB_OUTPUT"
      - name: Cache FluidNC simulator build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/camnc
            ~/.platformio
          # sim.mjs pins FluidNC and controls its build; the patch and toolchain must match the binary.
          key: fluidnc-sim-${{ runner.os }}-${{ runner.arch }}-${{ steps.simulator-toolchain.outputs.hash }}-${{ hashFiles('packages/fluidnc/scripts/sim.mjs', 'packages/fluidnc/sim/sim-speed.patch') }}
      - name: Start simulator with the 3.9.9 personality proxy
        working-directory: packages/fluidnc
        run: |
          started=$SECONDS
          node scripts/sim.mjs --v3 > sim.log 2>&1 &
          for i in $(seq 1 600); do
            if (echo > /dev/tcp/127.0.0.1/8848) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/8851) 2>/dev/null; then
              echo "Simulator ready after $((SECONDS - started)) s"
              # Show whether a cache hit reused the binary or rebuilt it, even on successful runs.
              cat sim.log
              exit 0
            fi
            sleep 1
          done
          echo "::error::The simulator did not open ports 8848 and 8851 within 600 s"
          tail -n 50 sim.log
          ps -ef | grep -E 'fluidnc|sim.mjs' | grep -v grep || true
          exit 1
      - name: Integration tests (FluidNC 4.1.1)
        working-directory: packages/fluidnc
        run: pnpm vitest run src/sim.integration.test.ts
        env:
          FLUIDNC_SIM_HOST: 127.0.0.1:8848
          FLUIDNC_SIM_VARIANT: v4
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          MERGIFY_TEST_JOB_NAME: FluidNC simulator integration (FluidNC 4.1.1)
      - name: Integration tests (3.9.9 personality)
        working-directory: packages/fluidnc
        run: pnpm vitest run src/sim.integration.test.ts
        env:
          FLUIDNC_SIM_HOST: 127.0.0.1:8850
          FLUIDNC_SIM_VARIANT: v3-81
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          MERGIFY_TEST_JOB_NAME: FluidNC simulator integration (3.9.9 personality)
      - name: Simulator log
        if: failure()
        run: cat packages/fluidnc/sim.log
