name: Claude review

# Reviews a PR when it opens, is reopened or leaves draft, and again when a
# collaborator comments "@claude review". Not on every push, to save
# subscription usage. Fork PRs are skipped on both paths: the review runs with
# the subscription token and a write token, so it only reads same-repo code.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    if: |
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !startsWith(github.head_ref, 'mergify/')) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Job-level, so comments that don't match the condition above don't cancel a running review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Skip fork PRs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cross=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json isCrossRepository -q .isCrossRepository)
          echo "same_repo=$([ "$cross" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Default ref: the PR's merge commit on pull_request, main on comments.
      # The review reads the PR's changes with gh, so no PR head is checked out
      # in the comment-triggered (secret-holding) context.
      - if: steps.source.outputs.same_repo == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - if: steps.source.outputs.same_repo == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ env.PR_NUMBER }}'
          claude_args: |
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
