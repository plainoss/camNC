name: Deploy

# Builds and deploys the camnc Workers from GitHub Actions: production on every push to main, and a preview version
# of camnc-preview on every pull request from this repository. Replaces Cloudflare Workers Builds, whose build
# minutes the account can run out of. Needs the CLOUDFLARE_API_TOKEN secret (Workers Scripts and D1 edit) and the
# CLERK_PUBLISHABLE_KEY_PRODUCTION and CLERK_PUBLISHABLE_KEY_PREVIEW variables.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'camnc' || 'camnc-preview' }}
    # Fork PRs get no token. Mergify's batch drafts are validated by CI and never previewed.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'mergify/merge-queue/'))
    # Job level: a preview is superseded by the PR's next commit, while production deploys run one after another.
    concurrency:
      group: deploy-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      # The preview's links go in one PR comment, edited on every upload.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      # The build key includes VITE_CLERK_PUBLISHABLE_KEY, so a cached build is only replayed for the same key.
      # The cache policy may only admit the CI workflow; without the cache the build just takes longer.
      - name: Authenticate remote cache
        if: vars.TURBO_TEAM != ''
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}
          audience: https://vercel.com/camnc-ci-cache
          policy: ${{ vars.TURBO_POLICY_ID }}
      - name: Build
        run: pnpm turbo run build --filter @wbcnc/camNC
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ github.event_name == 'push' && vars.CLERK_PUBLISHABLE_KEY_PRODUCTION || vars.CLERK_PUBLISHABLE_KEY_PREVIEW }}
      - name: Deploy production
        if: github.event_name == 'push'
        working-directory: apps/camNC
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload preview version
        if: github.event_name == 'pull_request'
        working-directory: apps/camNC
        # pipefail: a failed migration or upload must fail the step, not pass on tee's exit code.
        run: |
          set -o pipefail
          pnpm run deploy:preview --preview-alias pr-${{ github.event.pull_request.number }} | tee "$RUNNER_TEMP/preview.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Comment the preview links
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          alias=$(grep -Eo 'https://pr-[0-9]+-[^ ]+' "$RUNNER_TEMP/preview.log" | head -n 1)
          version=$(grep -Eo 'https://[0-9a-f]{8}-[^ ]+' "$RUNNER_TEMP/preview.log" | head -n 1)
          body=$(printf '<!-- camnc-preview -->\n**Preview** of %s\n\n- This PR, always the latest commit: %s\n- This commit: %s\n' "${SHA:0:7}" "$alias" "$version")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- camnc-preview -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  setup-smoke:
    name: Production setup smoke
    needs: deploy
    if: github.event_name == 'push'
    uses: ./.github/workflows/setup-smoke.yml
